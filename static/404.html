<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation not found - Pierpaolo &amp; Emanuela</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap');

:root {
  --cream: #f5ebdd;
  --paper: #fff8ed;
  --red: #e94a2b;
  --green: #278b6a;
  --yellow: #e9d85a;
  --pink: #e9b7b4;
  --blue: #315da8;
  --ink: #183b32;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 28px;
  background: var(--yellow);
  color: var(--ink);
  font-family: "DM Sans", sans-serif;
}

.card {
  position: relative;
  width: min(640px, 100%);
  padding: 68px 42px 54px;
  background: var(--paper);
  border: 2px solid var(--green);
  box-shadow: 10px 11px 0 var(--pink);
  text-align: center;
  transform: rotate(-.4deg);
}

.card::before {
  content: "404";
  position: absolute;
  top: 18px;
  left: 22px;
  color: var(--green);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .28em;
}

.card::after {
  content: "♥";
  position: absolute;
  right: 24px;
  bottom: 18px;
  color: var(--blue);
  font-size: 26px;
  transform: rotate(10deg);
}

.kicker {
  margin-bottom: 24px;
  color: var(--green);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .3em;
  text-transform: uppercase;
}

h1 {
  margin: 0;
  color: var(--red);
  font-family: "Instrument Serif", Georgia, serif;
  font-size: clamp(56px, 13vw, 104px);
  font-weight: 400;
  line-height: .78;
}

h1 em {
  display: block;
  color: var(--blue);
  font-weight: 400;
}

p {
  max-width: 430px;
  margin: 34px auto 0;
  color: var(--blue);
  font-family: "Instrument Serif", Georgia, serif;
  font-size: 22px;
  font-style: italic;
  line-height: 1.4;
}

a {
  display: inline-block;
  margin-top: 34px;
  padding: 15px 22px;
  background: var(--red);
  color: var(--paper);
  border: 2px solid var(--red);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .22em;
  text-decoration: none;
  text-transform: uppercase;
  transition: transform .2s, background .2s, color .2s;
}

a:hover {
  transform: rotate(-1.5deg);
  background: var(--yellow);
  color: var(--red);
}

@media (max-width: 560px) {
  body {
    padding: 18px;
  }

  .card {
    padding: 58px 24px 48px;
    box-shadow: 7px 8px 0 var(--pink);
  }
}
</style>
</head>
<body>
<main class="card">
  <div class="kicker">Pierpaolo + Emanuela</div>
  <h1>Invitation<em>not found.</em></h1>
  <p>This link does not match one of our invitations. Please check the message we sent you and open your personal link again.</p>
  <a href="/">Back to invitation</a>
</main>
</body>
</html>
